server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Astro emits content-hashed assets here — safe to cache forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Screenshots and other static media: cache for a week.
    location /screenshots/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Installer downloads (bind-mounted, kept out of the image and git).
    # Force "save as" and don't let proxies cache a stale build for long.
    location /downloads/ {
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=3600";
    }

    # Single-page static site: fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't leak the nginx version.
    server_tokens off;
}
