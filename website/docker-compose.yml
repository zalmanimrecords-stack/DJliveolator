# Liveolator marketing site.
#
# Deployed on the zalmanim VPS at /docker/liveolator, fronted by the existing
# Traefik reverse proxy (which owns ports 80/443 and runs the other
# *.zalmanim.com sites). This container publishes NO ports and runs NO proxy of
# its own — Traefik discovers it by the labels below and serves
# https://liveolator.zalmanim.com with a Let's Encrypt certificate, mirroring
# the other subdomains on that host.
#
# Requires (one-time): a DNS record  liveolator.zalmanim.com -> the VPS IP
# (Cloudflare, proxied — same as the sibling subdomains). See DEPLOY.md.
services:
  site:
    build: .
    image: liveolator-site:latest
    container_name: liveolator-site
    restart: unless-stopped
    volumes:
      # Installer(s) live here on the VPS, served at /downloads/. Kept out of
      # the image and git (large binary); update by copying a new .exe in.
      - ./downloads:/usr/share/nginx/html/downloads:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.liveolator.entrypoints=websecure
      - traefik.http.routers.liveolator.rule=Host(`liveolator.zalmanim.com`)
      - traefik.http.routers.liveolator.tls.certresolver=letsencrypt
      - traefik.http.services.liveolator.loadbalancer.server.port=80
